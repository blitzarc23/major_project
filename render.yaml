services:
  - type: web
    name: gyaankosh-api
    runtime: docker
    rootDir: server
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
